<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>AetherOS</title>
  <!-- AetherOSのロゴ（aether.css の .aether-os-logo-symbol と同じ形）。明るいタブでは黒、暗いタブでは白で表示します。 -->
  <style>
    .frame, .bar { stroke: #111; }
    .ring { stroke: #4f6fe0; }
    @media (prefers-color-scheme: dark) {
      .frame, .bar { stroke: #f0f0f0; }
      .ring { stroke: #91aaff; }
    }
  </style>
  <g transform="rotate(45 32 32)" fill="none">
    <rect class="frame" x="12" y="12" width="40" height="40" rx="8.5" stroke-width="5"/>
    <circle class="ring" cx="32" cy="32" r="11.5" stroke-width="4"/>
    <line class="bar" x1="17.5" y1="32" x2="46.5" y2="32" stroke-width="5"/>
  </g>
</svg>
