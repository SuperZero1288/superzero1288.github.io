<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRChat Portfolio</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2a2a2a;
            --accent-color: #00d2ff;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .profile-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        .vrchat-id {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .bio {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 12px;
            background-color: transparent;
            color: var(--text-color);
            text-decoration: none;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <!-- アバターの画像URLをここに入れるんだぞ？ -->
            <img src="https://via.placeholder.com/150" alt="Avatar" class="avatar">
            
            <!-- お前さんの名前とVRChatのIDを書く場所だな？ -->
            <h1>お前さんの名前</h1>
            <div class="vrchat-id">VRC ID: 自分のIDを入力</div>
            
            <!-- 自己紹介文 -->
            <p class="bio">
                ここにVRChatでの活動内容や、普段生息しているワールド、好きなことなんかを適当に書き連ねるんだぞ？Udonスクラッパーなりシェーダーいじりなり、アピールしたいことを書けばいいんじゃないか？
            </p>
            
            <!-- リンク集 -->
            <div class="links">
                <a href="https://vrchat.com/home/user/ユーザーID" target="_blank" class="btn">VRChat Profile</a>
                <a href="https://twitter.com/ユーザー名" target="_blank" class="btn">X (Twitter)</a>
                <a href="https://github.com/ユーザー名" target="_blank" class="btn">GitHub</a>
            </div>
        </div>
    </div>

</body>
</html>
