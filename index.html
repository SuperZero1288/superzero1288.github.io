<script>
const SVG_SUN=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"></path></svg>`;
const SVG_MOON=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M11.3807 2.01886C9.91573 3.38768 9 5.3369 9 7.49999C9 11.6421 12.3579 15 16.5 15C18.6631 15 20.6123 14.0843 21.9811 12.6193C21.6613 17.8537 17.3149 22 12 22C6.47715 22 2 17.5228 2 12C2 6.68514 6.14629 2.33869 11.3807 2.01886Z"></path></svg>`;

const statusBar=document.getElementById('statusBar');
const statusBarIndicator=document.getElementById('statusBarIndicator');
const statusTime=document.getElementById('statusTime');
const timeCapsule=document.getElementById('timeCapsule');
const themeToggleBtn=document.getElementById('themeToggleBtn');
const uiStyleToggleBtn=document.getElementById('uiStyleToggleBtn');
const themeIcon=document.getElementById('themeIcon');
const calendarPopup=document.getElementById('calendarPopup');
const calendarHeader=document.getElementById('calendarHeader');
const calendarDaysGrid=document.getElementById('calendarDaysGrid');
const blurOverlay=document.getElementById('blurOverlay');
const toast=document.getElementById('toast');
const snapContainer=document.getElementById('snapContainer');
const scrollIndicator=document.getElementById('scrollIndicator');

let hideTimeout,indicatorTimeout,toastTimeout;
let is24Hour=true,lastRenderedMonth=-1,isHoveringStatusBar=false;
let clickCount=0,clickTimer=null,isThursdayMode=false;

const uiStyles=[
{id:'style-default',name:'Default',light:true},
{id:'style-material',name:'Material',light:true},
{id:'style-liquidglass',name:'LiquidGlass',light:true},
{id:'style-fluent',name:'Fluent Design',light:true},
{id:'style-vrchat',name:'VRChat UI',light:false},
{id:'style-unity',name:'Unity Engine',light:false}
];

let currentStyleIndex=0;

function currentStyle(){return uiStyles[currentStyleIndex];}

function updateThemeButton(){
const light=document.body.classList.contains('light-theme');
const supported=currentStyle().light;
themeToggleBtn.disabled=!supported;
themeToggleBtn.classList.toggle('disabled',!supported);
themeToggleBtn.title=supported?'ダーク/ライト切り替え':'このテーマはライトモードに対応していません';
themeIcon.innerHTML=light?SVG_SUN:SVG_MOON;
}

function showToast(text){
toast.textContent=text;
toast.classList.add('show');
clearTimeout(toastTimeout);
toastTimeout=setTimeout(()=>toast.classList.remove('show'),2000);
}

calendarPopup.addEventListener('click',e=>e.stopPropagation());

function updateTime(){
const now=new Date();
if(isThursdayMode){statusTime.textContent=now.getDay()===4?'はい':'いいえ';return;}
let hours=now.getHours();
const minutes=String(now.getMinutes()).padStart(2,'0');
if(is24Hour){
statusTime.textContent=`${String(hours).padStart(2,'0')}:${minutes}`;
}else{
const ampm=hours>=12?'PM':'AM';
hours=hours%12||12;
statusTime.textContent=`${ampm} ${hours}:${minutes}`;
}
const currentMonth=now.getMonth();
if(lastRenderedMonth!==currentMonth){renderCalendar(now);lastRenderedMonth=currentMonth;}
}

function renderCalendar(now){
const year=now.getFullYear(),month=now.getMonth(),today=now.getDate();
const monthStr=String(month+1).padStart(2,'0');
calendarHeader.textContent=`${year}.${monthStr}`;
calendarDaysGrid.innerHTML='';
const firstDayIndex=new Date(year,month,1).getDay();
const totalDays=new Date(year,month+1,0).getDate();

for(let i=0;i<firstDayIndex;i++){
const emptyCell=document.createElement('div');
emptyCell.className='calendar-day-cell empty';
calendarDaysGrid.appendChild(emptyCell);
}

for(let day=1;day<=totalDays;day++){
const dayCell=document.createElement('div');
dayCell.className='calendar-day-cell';
const cellDate=new Date(year,month,day);
const dayOfWeek=cellDate.getDay();
if(dayOfWeek===0)dayCell.classList.add('sun');
if(dayOfWeek===6)dayCell.classList.add('sat');
if(day===today)dayCell.classList.add('is-today');
dayCell.textContent=day;
dayCell.addEventListener('click',()=>{
const formattedDate=`${year}/${monthStr}/${String(day).padStart(2,'0')}`;
navigator.clipboard.writeText(formattedDate).then(()=>showToast(`コピーしました: ${formattedDate}`)).catch(console.error);
});
calendarDaysGrid.appendChild(dayCell);
}
}

timeCapsule.addEventListener('click',()=>{
clickCount++;
if(clickCount>=5){
if(Math.random()<0.3){
isThursdayMode=!isThursdayMode;
showToast(isThursdayMode?'Is it Thursday...?':'時刻表示に戻りました');
}else is24Hour=!is24Hour;
clickCount=0;
clearTimeout(clickTimer);
updateTime();
return;
}
clearTimeout(clickTimer);
clickTimer=setTimeout(()=>clickCount=0,800);
if(!isThursdayMode)is24Hour=!is24Hour;
updateTime();
});

updateTime();
setInterval(updateTime,1000);

function hideStatusBarWithDelay(delayMs){
clearTimeout(hideTimeout);
hideTimeout=setTimeout(()=>{
statusBar.classList.add('hidden');
indicatorTimeout=setTimeout(()=>{
if(statusBar.classList.contains('hidden'))statusBarIndicator.classList.add('visible');
},350);
},delayMs);
}

function checkStatusBarStateOnScroll(){
clearTimeout(hideTimeout);
if(snapContainer.scrollTop<window.innerHeight*.5){
statusBar.classList.remove('hidden');
clearTimeout(indicatorTimeout);
statusBarIndicator.classList.remove('visible');
}else if(!isHoveringStatusBar)hideStatusBarWithDelay(0);
}

checkStatusBarStateOnScroll();

snapContainer.addEventListener('scroll',()=>{
const scrollTop=snapContainer.scrollTop;
const scrollRatio=Math.min(scrollTop/window.innerHeight,1);
const blurVal=scrollRatio*16;
blurOverlay.style.backdropFilter=`blur(${blurVal}px)`;
blurOverlay.style.webkitBackdropFilter=`blur(${blurVal}px)`;
blurOverlay.style.backgroundColor=`rgba(0,0,0,${scrollRatio*.4})`;
if(scrollTop>100)scrollIndicator.classList.add('hidden');
checkStatusBarStateOnScroll();
},{passive:true});

window.addEventListener('mousemove',e=>{
if(snapContainer.scrollTop>=window.innerHeight*.5&&e.clientY<=70){
clearTimeout(indicatorTimeout);
statusBarIndicator.classList.remove('visible');
statusBar.classList.remove('hidden');
}
});

statusBar.addEventListener('mouseenter',()=>{
isHoveringStatusBar=true;
clearTimeout(hideTimeout);
clearTimeout(indicatorTimeout);
statusBarIndicator.classList.remove('visible');
statusBar.classList.remove('hidden');
});

statusBar.addEventListener('mouseleave',()=>{
isHoveringStatusBar=false;
if(snapContainer.scrollTop>=window.innerHeight*.5)hideStatusBarWithDelay(600);
});

themeToggleBtn.addEventListener('click',()=>{
if(!currentStyle().light)return;
document.body.classList.toggle('light-theme');
updateThemeButton();
});

uiStyleToggleBtn.addEventListener('click',()=>{
document.body.classList.remove(uiStyles[currentStyleIndex].id);
currentStyleIndex=(currentStyleIndex+1)%uiStyles.length;
const newStyle=uiStyles[currentStyleIndex];
document.body.classList.add(newStyle.id);

if(!newStyle.light&&document.body.classList.contains('light-theme')){
document.body.classList.remove('light-theme');
showToast(`${newStyle.name} はダークモードのみ対応`);
}else{
showToast(newStyle.name);
}
updateThemeButton();
});

updateThemeButton();
</script>
</body>
</html>
