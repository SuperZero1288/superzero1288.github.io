<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme App Framework</title>
    <style>
        :root {
            /* Default Theme Colors */
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaaaa;
            --accent-color: #007acc;
            --border-radius: 8px;
        }

        /* Material Theme */
        [data-theme="material"] {
            --bg-primary: #e0e0e0;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f5f5f5;
            --text-primary: #212121;
            --text-secondary: #757575;
            --accent-color: #6200ee;
            --border-radius: 4px;
        }

        /* Fluent Theme */
        [data-theme="fluent"] {
            --bg-primary: #f3f3f3;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e5e5e5;
            --text-primary: #000000;
            --text-secondary: #606060;
            --accent-color: #0078d4;
            --border-radius: 2px;
        }

        /* Unity Theme */
        [data-theme="unity"] {
            --bg-primary: #383838;
            --bg-secondary: #282828;
            --bg-tertiary: #1e1e1e;
            --text-primary: #dcdcdc;
            --text-secondary: #aaaaaa;
            --accent-color: #2c5d88;
            --border-radius: 0px;
        }

        /* Steam Theme */
        [data-theme="steam"] {
            --bg-primary: #171a21;
            --bg-secondary: #1b2838;
            --bg-tertiary: #2a475e;
            --text-primary: #c6d4df;
            --text-secondary: #8f98a0;
            --accent-color: #66c0f4;
            --border-radius: 3px;
        }

        /* VRChat Theme */
        [data-theme="vrchat"] {
            --bg-primary: #0d1419;
            --bg-secondary: #141f26;
            --bg-tertiary: #1c2b35;
            --text-primary: #ffffff;
            --text-secondary: #7094a6;
            --accent-color: #02e2d0;
            --accent-glow: rgba(2, 226, 208, 0.3);
            --border-radius: 12px;
        }

        /* Light Mode Override (Only for default, material, fluent) */
        [data-mode="light"][data-theme="default"],
        [data-mode="light"][data-theme="material"],
        [data-mode="light"][data-theme="fluent"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f0f0f0;
            --bg-tertiary: #e0e0e0;
            --text-primary: #111111;
            --text-secondary: #555555;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: var(--border-radius);
            align-items: center;
        }

        select, button {
            padding: 8px 12px;
            border-radius: var(--border-radius);
            border: 1px solid var(--text-secondary);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* VRChat Faithful UI Styling */
        .vrchat-ui-container {
            display: grid;
            grid-template-columns: 240px 1fr 240px;
            gap: 15px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .vrchat-panel {
            background-color: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        [data-theme="vrchat"] .vrchat-panel {
            border: 1px solid var(--text-secondary);
        }

        /* Top Header in VRChat */
        .vrchat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-tertiary);
            padding: 10px 15px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
        }

        [data-theme="vrchat"] .vrchat-user-badge {
            background: linear-gradient(90deg, #005a52, #02e2d0);
            padding: 4px 12px;
            border-radius: 20px;
            color: #000;
            font-weight: bold;
            font-size: 0.85em;
        }

        /* Menu Grid Buttons */
        .vrchat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .vrchat-btn {
            background-color: var(--bg-tertiary);
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            padding: 20px 10px;
            text-align: center;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        [data-theme="vrchat"] .vrchat-btn:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
            color: var(--accent-color);
        }

        /* Slider Controls */
        .vrchat-slider-group {
            margin-bottom: 15px;
        }

        .vrchat-slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }

        .vrchat-slider-bar {
            height: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .vrchat-slider-fill {
            height: 100%;
            background: var(--accent-color);
            width: 70%;
        }
    </style>
</head>
<body data-theme="default" data-mode="dark">

    <div class="controls">
        <label>テーマ: 
            <select id="themeSelect" onchange="updateTheme()">
                <option value="default">Default</option>
                <option value="material">Material</option>
                <option value="fluent">Fluent</option>
                <option value="unity">Unity</option>
                <option value="steam">Steam</option>
                <option value="vrchat">VRChat</option>
            </select>
        </label>

        <button id="modeToggleBtn" onclick="toggleMode()">モード: Dark</button>
    </div>

    <!-- UI View -->
    <div class="vrchat-ui-container">
        <!-- Left Sub Panel -->
        <div class="vrchat-panel">
            <h3>My Profile</h3>
            <p style="color: var(--text-secondary); font-size: 0.85em;">ステータス</p>
            <p style="color: var(--accent-color);">きいてみてね</p>
            <hr style="border-color: var(--bg-tertiary);">
            <p style="font-size: 0.9em;">アバター: <strong>Chiffon Klorfi</strong></p>
            <p style="font-size: 0.9em;">ワールド: <strong>Elite's RNG La...</strong></p>
        </div>

        <!-- Main Center Panel -->
        <div class="vrchat-panel">
            <div class="vrchat-header">
                <div class="vrchat-user-badge">ぜろくんでんせつ</div>
                <div style="font-weight: bold;">Launch Pad</div>
                <div style="color: var(--accent-color);">V199</div>
            </div>

            <div class="vrchat-slider-group">
                <div class="vrchat-slider-label"><span>マスター音量</span><span>100%</span></div>
                <div class="vrchat-slider-bar"><div class="vrchat-slider-fill" style="width: 100%;"></div></div>
            </div>
            <div class="vrchat-slider-group">
                <div class="vrchat-slider-label"><span>ワールド音量</span><span>60%</span></div>
                <div class="vrchat-slider-bar"><div class="vrchat-slider-fill" style="width: 60%;"></div></div>
            </div>

            <div class="vrchat-grid">
                <div class="vrchat-btn">ワールド</div>
                <div class="vrchat-btn">アバター</div>
                <div class="vrchat-btn">ソーシャル</div>
                <div class="vrchat-btn">グループ</div>
                <div class="vrchat-btn">ショップ</div>
                <div class="vrchat-btn">設定</div>
            </div>
        </div>

        <!-- Right Sub Panel -->
        <div class="vrchat-panel">
            <h3>フレンド (47)</h3>
            <ul style="list-style: none; padding: 0; font-size: 0.9em; color: var(--text-secondary);">
                <li style="margin-bottom: 10px; color: var(--text-primary);">● 87mizuki</li>
                <li style="margin-bottom: 10px;">● cresc28</li>
                <li style="margin-bottom: 10px;">● crisis1373</li>
            </ul>
        </div>
    </div>

    <script>
        const modeSupportedThemes = ['default', 'material', 'fluent'];

        function updateTheme() {
            const theme = document.getElementById('themeSelect').value;
            const body = document.body;
            const modeBtn = document.getElementById('modeToggleBtn');

            body.setAttribute('data-theme', theme);

            // ダーク/ライトモード切り替えが機能するテーマか判定
            if (modeSupportedThemes.includes(theme)) {
                modeBtn.disabled = false;
            } else {
                modeBtn.disabled = true;
                // サポート対象外テーマの場合はダーク固定に戻す
                body.setAttribute('data-mode', 'dark');
                modeBtn.innerText = 'モード: Dark (固定)';
            }
        }

        function toggleMode() {
            const body = document.body;
            const currentMode = body.getAttribute('data-mode');
            const newMode = currentMode === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-mode', newMode);
            document.getElementById('modeToggleBtn').innerText = `モード: ${newMode.charAt(0).toUpperCase() + newMode.slice(1)}`;
        }

        // 初期化実行
        updateTheme();
    </script>
</body>
</html>
