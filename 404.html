<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 / ぜろくんでんせつ</title>
<link rel="stylesheet" href="/style.css">
<script src="/site-loader.js" defer></script>
</head>
<body class="style-default error-page">
<div class="site-loader" id="siteLoader" role="status" aria-live="polite" aria-label="画像を読み込んでいます">
<div class="site-loader-mark">Z<span>/</span>0</div>
<div class="site-loader-progress"></div>
<p class="site-loader-status">LOADING ASSETS</p>
</div>
<div class="floating-status-bar error-status-bar">
<a class="status-capsule icon-btn" href="/" title="トップページへ戻る" aria-label="トップページへ戻る">
<span class="svg-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10.7 2.3 1 12l9.7 9.7 1.4-1.4L4.8 13H23v-2H4.8l7.3-7.3-1.4-1.4Z"/></svg></span>
</a>
<span class="status-capsule error-location">UNKNOWN / 404</span>
<div class="status-right-group">
<button class="status-capsule icon-btn" id="uiStyleToggleBtn" type="button" title="UIデザイン切り替え" aria-label="UIデザイン切り替え">
<span class="svg-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93Zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39Z"/></svg></span>
</button>
<button class="status-capsule icon-btn" id="themeToggleBtn" type="button" title="ダーク/ライト切り替え" aria-label="ダーク/ライト切り替え">
<span class="svg-icon" id="themeIcon"></span>
</button>
</div>
</div>

<main class="error-stage">
<section class="error-card" aria-labelledby="error-title">
<div class="error-code" aria-hidden="true"><span>4</span><span class="error-zero">0</span><span>4</span></div>
<p class="error-eyebrow" id="styleName">DEFAULT INTERFACE</p>
<h1 id="error-title">このページは、まだ存在しないみたいです。</h1>
<p class="error-message">リンクが変わったか、これから作られるページかもしれません。迷子ついでにテーマを切り替えて遊んでいきませんか？</p>
<div class="error-actions">
<a class="error-primary" href="/">トップページへ戻る</a>
<button class="error-secondary" type="button" id="historyBack">ひとつ前へ戻る</button>
</div>
<p class="error-path" id="errorPath"></p>
</section>
</main>

<div class="toast-notification" id="toast" role="status" aria-live="polite"></div>

<script>
const SVG_SUN=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12Zm-1-17h2v3h-2V1Zm0 19h2v3h-2v-3ZM3.5 4.9l1.4-1.4L7 5.6 5.6 7 3.5 4.9Zm13.4 13.5 1.5-1.5 2.1 2.2-1.4 1.4-2.2-2.1Zm2.2-14.9 1.4 1.4L18.4 7 17 5.6l2.1-2.1ZM5.6 17 7 18.4l-2.1 2.1-1.4-1.4L5.6 17ZM23 11v2h-3v-2h3ZM4 11v2H1v-2h3Z"/></svg>`;
const SVG_MOON=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M11.4 2C9.9 3.4 9 5.3 9 7.5A7.5 7.5 0 0 0 16.5 15c2.2 0 4.1-.9 5.5-2.4A10 10 0 1 1 11.4 2Z"/></svg>`;
const uiStyles=[
  {id:'style-default',name:'Default',label:'DEFAULT INTERFACE',light:true},
  {id:'style-material',name:'Material',label:'MATERIAL / GOOGLE',light:true},
  {id:'style-liquidglass',name:'LiquidGlass',label:'LIQUID GLASS / APPLE',light:true},
  {id:'style-fluent',name:'Fluent Design',label:'FLUENT / MICROSOFT',light:true},
  {id:'style-vrchat',name:'VRChat UI',label:'VRCHAT HUD / ERROR',light:false},
  {id:'style-unity',name:'Unity Engine',label:'UNITY ENGINE / MISSING ASSET',light:false}
];
const themeToggleBtn=document.getElementById('themeToggleBtn');
const uiStyleToggleBtn=document.getElementById('uiStyleToggleBtn');
const themeIcon=document.getElementById('themeIcon');
const styleName=document.getElementById('styleName');
const toast=document.getElementById('toast');
let toastTimer;
let currentStyleIndex=0;

function showToast(text){
  toast.textContent=text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}

function updateThemeButton(){
  const style=uiStyles[currentStyleIndex];
  const light=document.body.classList.contains('light-theme');
  themeToggleBtn.disabled=!style.light;
  themeToggleBtn.classList.toggle('disabled',!style.light);
  themeToggleBtn.title=style.light?'ダーク/ライト切り替え':'このテーマはライトモードに対応していません';
  themeIcon.innerHTML=light?SVG_SUN:SVG_MOON;
  styleName.textContent=style.label;
}

themeToggleBtn.addEventListener('click',()=>{
  if(!uiStyles[currentStyleIndex].light)return;
  document.body.classList.toggle('light-theme');
  updateThemeButton();
});

uiStyleToggleBtn.addEventListener('click',()=>{
  document.body.classList.remove(uiStyles[currentStyleIndex].id);
  currentStyleIndex=(currentStyleIndex+1)%uiStyles.length;
  const style=uiStyles[currentStyleIndex];
  document.body.classList.add(style.id);
  if(!style.light&&document.body.classList.contains('light-theme')){
    document.body.classList.remove('light-theme');
    showToast(`${style.name} はダークモードのみ対応`);
  }else{
    showToast(style.name);
  }
  updateThemeButton();
});

document.getElementById('historyBack').addEventListener('click',()=>{
  if(history.length>1)history.back();
  else location.href='/';
});

document.getElementById('errorPath').textContent=`REQUESTED: ${location.pathname}`;
updateThemeButton();
</script>
</body>
</html>
