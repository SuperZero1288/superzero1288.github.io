name: "C51015D: note記事を同期"

# 同じリポジトリに置いている独立したサイト（/C51015D/）用です。ぜろくんでんせつ のサイトの同期とは別に動きます。
# C51015D/config.json の note.user が空のあいだは、何もせずに終わります。
on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-note-c51015d
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: サイトを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: note記事を取得
        run: node C51015D/scripts/sync-note.mjs

      - name: 更新を保存
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- C51015D)" ]; then
            echo "更新はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add C51015D/
          git commit -m "C51015D: note記事を自動同期 [skip ci]"
          # もう一方のサイトの同期と重なっても失敗しないよう、最新に合わせてから送る
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
